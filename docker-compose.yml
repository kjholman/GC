# Local stack: Postgres + the app. For production, use a managed Postgres
# (e.g. Azure Database for PostgreSQL / AWS RDS in ca-central-1).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: genesys
      POSTGRES_PASSWORD: genesys
      POSTGRES_DB: genesys_analyst
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://genesys:genesys@db:5432/genesys_analyst
    ports: ["3000:3000"]
    depends_on: [db]
volumes:
  pgdata:
